# Auto-provision the Prometheus datasource so Grafana is wired up on first boot.
# Prometheus runs as the `asp-prometheus` container (service `prometheus`) on asp-network.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus            # dashboards reference this uid
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
