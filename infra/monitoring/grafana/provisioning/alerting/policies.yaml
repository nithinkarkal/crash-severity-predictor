# Grafana alerting — notification policy (routes every alert to the Slack contact point).
apiVersion: 1

policies:
  - orgId: 1
    receiver: slack-asp                 # default: send all alerts to Slack
    group_by: ['grafana_folder', 'alertname']
    group_wait: 30s                     # wait a bit to batch related alerts
    group_interval: 5m
    repeat_interval: 4h                 # re-notify if still firing
