# ASP Nginx - TLS termination + reverse proxy to asp-backend:8000
# Certificates are mounted at runtime (never baked into the image).

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile           on;
    keepalive_timeout  65;

    # --------------------------------------------------------------------
    # Rate limiting zones (keyed by client IP)
    #   login   -> strict
    #   train   -> ~1 request/minute/IP
    #   predict -> permissive
    #   health  -> generous
    #   grafana -> high
    # --------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=asp_login_limit:10m   rate=6r/m;
    limit_req_zone $binary_remote_addr zone=asp_train_limit:10m   rate=1r/m;
    limit_req_zone $binary_remote_addr zone=asp_predict_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=asp_health_limit:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=asp_grafana_limit:10m rate=30r/s;

    limit_req_status 429;

    # --------------------------------------------------------------------
    # Shared proxy settings
    # --------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript text/xml application/xml;

    # --------------------------------------------------------------------
    # HTTP - redirect everything to HTTPS
    # --------------------------------------------------------------------
    server {
        listen 80;
        server_name asp.local _;

        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------------------
    # HTTPS - TLS termination, reverse proxy to backend
    # --------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name asp.local;

        # Development self-signed certificate
        # generated locally for development; mounted read-only at runtime and never committed
        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ----------------------------------------------------------------
        # Request size protection
        # ----------------------------------------------------------------
        client_max_body_size 10m;
        client_body_buffer_size 128k;
        client_body_timeout 15s;

        # ----------------------------------------------------------------
        # Security headers
        # ----------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ----------------------------------------------------------------
        # /api/v1/login - strict rate limit
        # ----------------------------------------------------------------
        location = /api/v1/login {
            limit_req zone=asp_login_limit burst=1 nodelay;

            proxy_pass              http://asp-backend:8000;
            proxy_http_version      1.1;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        Connection $connection_upgrade;

            proxy_connect_timeout   5s;
            proxy_read_timeout      30s;
            proxy_send_timeout      30s;
            proxy_buffering         on;
        }

        # ----------------------------------------------------------------
        # /api/v1/train - ~1 request/minute/IP
        # ----------------------------------------------------------------
        location = /api/v1/train {
            limit_req zone=asp_train_limit burst=1 nodelay;

            proxy_pass              http://asp-backend:8000;
            proxy_http_version      1.1;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        Connection $connection_upgrade;

            proxy_connect_timeout   5s;
            proxy_read_timeout      60s;
            proxy_send_timeout      60s;
            proxy_buffering         on;
        }

        # ----------------------------------------------------------------
        # /api/v1/predict - permissive
        # ----------------------------------------------------------------
        location = /api/v1/predict {
            limit_req zone=asp_predict_limit burst=20 nodelay;

            proxy_pass              http://asp-backend:8000;
            proxy_http_version      1.1;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        Connection $connection_upgrade;

            proxy_connect_timeout   5s;
            proxy_read_timeout      120s;
            proxy_send_timeout      60s;
            proxy_buffering         on;
        }

        # ----------------------------------------------------------------
        # /api/v1/health - generous
        # ----------------------------------------------------------------
        location = /api/v1/health {
            limit_req zone=asp_health_limit burst=50 nodelay;

            proxy_pass              http://asp-backend:8000;
            proxy_http_version      1.1;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        Connection $connection_upgrade;

            proxy_connect_timeout   5s;
            proxy_read_timeout      30s;
            proxy_send_timeout      30s;
            proxy_buffering         on;
        }

        # ----------------------------------------------------------------
        # /grafana/ - Grafana monitoring dashboards
        # ----------------------------------------------------------------
        location /grafana/ {
            limit_req zone=asp_grafana_limit burst=100 nodelay;

            proxy_pass              http://asp-grafana:3000;
            proxy_http_version      1.1;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            # Grafana Live uses WebSockets for real-time dashboard updates
            proxy_set_header        Upgrade $http_upgrade;
            proxy_set_header        Connection $connection_upgrade;

            proxy_connect_timeout   5s;
            proxy_read_timeout      60s;
            proxy_send_timeout      60s;
            proxy_buffering         on;
        }

        # Redirect to grafana base directory
        location = /grafana {
            return 301 /grafana/;
        }

        # ----------------------------------------------------------------
        # Fallback: any other API route (no rate limiting beyond defaults)
        # ----------------------------------------------------------------
        location /api/ {
            proxy_pass              http://asp-backend:8000;
            proxy_http_version      1.1;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        Connection $connection_upgrade;

            proxy_connect_timeout   5s;
            proxy_read_timeout      60s;
            proxy_send_timeout      60s;
            proxy_buffering         on;
        }

        # Reject anything not part of the API
        location / {
            return 404;
        }
    }
}
