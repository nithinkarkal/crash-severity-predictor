# The Monitoring page embeds Grafana in the browser, so it needs the public HTTPS URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: asp
spec:
  template:
    spec:
      containers:
        - name: frontend
          env:
            - name: BACKEND_URL
              value: "http://backend:8000"
            - name: GRAFANA_URL
              value: "https://__DOMAIN__/grafana"
