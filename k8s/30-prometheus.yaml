# Prometheus. Config (prometheus.yml + alert_rules.yml) comes from a ConfigMap created
# from the existing files in infra/monitoring/prometheus/ (see k8s/README.md deploy step).
# Its scrape targets (backend:8000, node-exporter:9100) match the Service names below.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: asp
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: asp
  labels: { app: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      securityContext:
        fsGroup: 65534   # 'nobody' — so the mounted PVC is writable by Prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.0.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=30d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: asp
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
