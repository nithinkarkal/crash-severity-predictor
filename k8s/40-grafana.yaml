# Grafana. Datasource + dashboard-provider + dashboard JSON come from ConfigMaps created
# from the existing infra/monitoring/grafana/ files (see k8s/README.md). Admin creds + Slack
# webhook come from the asp-grafana-env Secret; the k8s-specific server/embedding settings are
# set explicitly here (explicit env overrides envFrom for the same key).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: asp
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: asp
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext:
        fsGroup: 472   # grafana user — makes the PVC writable
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
          env:
            - { name: GF_SERVER_ROOT_URL, value: "http://asp.local/grafana" }
            - { name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true" }
            - { name: GF_SECURITY_ALLOW_EMBEDDING, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer" }
          envFrom:
            - secretRef: { name: asp-grafana-env }   # GF_SECURITY_ADMIN_*, SLACK_WEBHOOK_URL
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: providers, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true }
            - { name: data, mountPath: /var/lib/grafana }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: providers
          configMap: { name: grafana-dashboard-providers }
        - name: dashboards
          configMap: { name: grafana-dashboards }
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: asp
spec:
  selector: { app: grafana }
  ports:
    - port: 3000
      targetPort: 3000
