# kind (Kubernetes-in-Docker) cluster for local testing.
# One node, labelled ingress-ready, with host ports 80/443 mapped so http://asp.local works.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: asp
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 80, protocol: TCP }
      - { containerPort: 443, hostPort: 443, protocol: TCP }
