name: 🔍 ASP Code Quality Check

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync \
            --group dev \
            --group backend \
            --group training

      - name: 🔍 Ruff Linter
        run: uv run ruff check .

      - name: 🎨 Ruff Formatter
        run: uv run ruff format --check .

      - name: 📝 MyPy Type Check
        run: uv run mypy common/ services/
