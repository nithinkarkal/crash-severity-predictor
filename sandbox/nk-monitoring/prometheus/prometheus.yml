# Prometheus config — NK monitoring sandbox.
# Scrapes the demo-exporter by default so the stack works standalone.
# To use REAL numbers instead, comment the "demo-exporter" job and uncomment the
# "asp-backend" job at the bottom (needs the team's backend running).

global:
  scrape_interval: 15s          # how often to pull metrics from each target
  evaluation_interval: 15s      # how often to evaluate the alert rules
  external_labels:
    project: accident-severity-predictor
    env: nk-sandbox

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Prometheus scraping itself — tells you Prometheus is alive.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Host/infrastructure metrics (whole-machine CPU, memory, disk).
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "infrastructure"

  # Per-container Docker metrics (CPU/mem/network for each running container).
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: "docker"

  # DEFAULT source: our demo exporter (fake but realistic ASP metrics).
  - job_name: "asp-demo"
    metrics_path: /metrics
    static_configs:
      - targets: ["demo-exporter:8010"]
        labels:
          service: "backend"          # same label as the real backend, so dashboards port over

  # REAL source (optional): the team's backend /metrics endpoint.
  # 1) comment out the "asp-demo" job above
  # 2) uncomment this, and make sure the backend is reachable on this network
  #    (run it via the main compose, or use host.docker.internal on Docker Desktop).
  # - job_name: "asp-backend"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["host.docker.internal:8000"]   # or "backend:8000" on the shared network
  #       labels:
  #         service: "backend"
