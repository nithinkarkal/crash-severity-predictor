# Accident Severity Predictor (ASP) - docker-compose.yaml
#
# Usage:
#   docker compose up -d --build backend
#   docker compose down

services:
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile.backend
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
        # solve: ERROR - stderr: permission denied
        # while trying to connect to the docker API at unix:///var/run/docker.sock
        # DOCKER_GID: ${DOCKER_GID}
    image: asp-backend:latest
    container_name: asp-backend
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - /var/run/docker.sock:/var/run/docker.sock

    # save abs path in an .env file
    env_file:
      - .env.backend  # backend creds
    environment:
      HOST_DATA_DIR: ${HOST_PROJECT_ROOT}/data
      HOST_ARTIFACTS_DIR: ${HOST_PROJECT_ROOT}/artifacts
      DAGSHUB_USER_TOKEN: ${DAGSHUB_USER_TOKEN}
      MLFLOW_HTTP_REQUEST_TIMEOUT: "300"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    restart: unless-stopped
    networks:
      - asp-network

  # Nginx TLS-terminating reverse proxy
  #   - Host port 8081 -> container 443 (HTTPS only; HTTP 80 redirects to HTTPS)
  #   - Certificates are mounted read-only from the local filesystem and are
  #     never baked into the image.
  #   - Waits for the backend healthcheck before taking traffic.
  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile.nginx
    image: asp-nginx:latest
    container_name: asp-nginx
    ports:
      - "8081:443"
    volumes:
      # Mount only the generated development certificate (read-only).
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider https://127.0.0.1/api/v1/health --no-check-certificate || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - asp-network

  # training service only for building an image
  training:
    build:
      context: .
      dockerfile: services/training/Dockerfile.training
      args:
        USER_ID: ${UID}
        GROUP_ID: ${GID}
    image: asp-training:latest
    profiles: ["build-only"]  # add profile so it not starts with docker compose up
    # only to comfirm build is done
    command: ["echo", "Training image built"]
    networks:
      - asp-network

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: asp-prometheus
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"  # allows POST /-/reload to pick up config changes without restart
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - asp-network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: asp-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    expose:
      - "9100"
    restart: unless-stopped
    networks:
      - asp-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: asp-grafana
    env_file:
      - .env.grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro  # datasource + dashboard providers
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro   # dashboard JSONs (auto-loaded)
    expose:
      - "3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - asp-network

networks:
  asp-network:
    name: asp-network
    driver: bridge

volumes:
  prometheus-data:
    name: asp-prometheus-data
  grafana-data:
    name: asp-grafana-data
